name: Agents - mapa normativo
on:
  workflow_dispatch:
  push:
    paths:
      - README.md
      - AGENTS.md
      - .ia.rules/**/*.md
      - .ia.rules/normative-index.json
      - .ia.rules/core/formats/normative-index.v1.schema.json
      - .ia.rules/scenarios/governance/scripts/normative-graph.py
      - .ia.rules/scenarios/governance/scripts/requirements-normative-graph.txt
      - .ia.rules/runtime/runtime-matrix.json
permissions:
  contents: write
concurrency:
  group: agents-normative-graph-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip normative-graph]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --disable-pip-version-check -r .ia.rules/scenarios/governance/scripts/requirements-normative-graph.txt
      - run: python .ia.rules/scenarios/governance/scripts/normative-graph.py --write --check
      - name: Confirmar revisão e registrar derivados
        shell: bash
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if ! git diff --quiet -- README.md .ia.rules/generated .ia.rules/normative-index.json; then
            git config user.name agents-governance
            git config user.email actions@users.noreply.github.com
            git add -- README.md .ia.rules/generated .ia.rules/normative-index.json
            git commit -m "Atualiza mapa normativo [skip normative-graph]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
