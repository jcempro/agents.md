name: Builder - matriz de runtimes
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    paths:
      - src/**
      - test/**
      - config/**
      - package.json
      - package-lock.json
      - .github/workflows/runtime-matrix.yml
permissions:
  contents: read
jobs:
  validate:
    concurrency:
      group: builder-runtime-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --disable-pip-version-check -r src/.ia.rules/scenarios/governance/scripts/requirements-normative-graph.txt
      - run: npm ci
      - run: npm test
      - run: git diff --exit-code
